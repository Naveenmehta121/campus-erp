# ============================================================
# CampusERP — configuration
# Default database: H2 (file mode). No MySQL needed to run.
# Data lives in ./data/campuserp.mv.db next to the project.
# ============================================================
spring.application.name=campus-erp
server.port=8080

# --- H2 (default) ---
spring.datasource.url=jdbc:h2:file:./data/campuserp;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# H2 web console: http://localhost:8080/h2-console  (JDBC URL above, user sa, no password)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- MySQL switch (uncomment to use MySQL instead of H2) ---
# 1. Create the database:  CREATE DATABASE campuserp;
# 2. Comment out the 4 spring.datasource.* lines above, then uncomment these:
#spring.datasource.url=jdbc:mysql://localhost:3306/campuserp?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.datasource.username=root
#spring.datasource.password=YOUR_MYSQL_PASSWORD
# 3. Add the MySQL driver to pom.xml:
#    <dependency><groupId>com.mysql</groupId><artifactId>mysql-connector-j</artifactId><scope>runtime</scope></dependency>
# 4. spring.h2.console.enabled=false
# NOTE: H2 is fine for learning/demo. For real production use MySQL/PostgreSQL.
